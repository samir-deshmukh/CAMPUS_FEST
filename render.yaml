services:
  - type: web
    name: CampusFest-Backend
    runtime: python
    plan: free
    repo: https://github.com/samir-deshmukh/CAMPUS_FEST
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECURITY_JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: CampusFest-DB
          property: connectionString

  - type: web
    name: CampusFest-Student
    runtime: static
    plan: free
    repo: https://github.com/samir-deshmukh/CAMPUS_FEST
    branch: main
    buildCommand: cd site && npm ci && npm run build
    staticPublishPath: site/dist
    envVars:
      - key: VITE_API_URL
        value: https://campusfest-backend.onrender.com/api

  - type: web
    name: CampusFest-Admin
    runtime: static
    plan: free
    repo: https://github.com/samir-deshmukh/CAMPUS_FEST
    branch: main
    buildCommand: cd admin && npm ci && npm run build
    staticPublishPath: admin/dist
    envVars:
      - key: VITE_API_URL
        value: https://campusfest-backend.onrender.com/api

databases:
  - name: CampusFest-DB
    plan: free
    region: singapore
    postgresMajorVersion: '16'
