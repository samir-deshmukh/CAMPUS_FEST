services:
  - type: web
    name: Sai-CampusFest-Backend
    runtime: python
    plan: free
    repo: https://github.com/samir-deshmukh/Sai
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECURITY_JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: Sai-Student
    runtime: static
    plan: free
    repo: https://github.com/samir-deshmukh/Sai
    branch: main
    buildCommand: cd site && npm ci && npm run build
    staticPublishPath: site/dist
    envVars:
      - key: VITE_API_URL
        value: https://sai-campusfest-backend.onrender.com/api

  - type: web
    name: Sai
    runtime: static
    plan: free
    repo: https://github.com/samir-deshmukh/Sai
    branch: main
    buildCommand: cd admin && npm ci && npm run build
    staticPublishPath: admin/dist
    envVars:
      - key: VITE_API_URL
        value: https://sai-campusfest-backend.onrender.com/api

databases:
  - name: Sai-CampusFest-DB
    plan: free
    region: singapore
    postgresMajorVersion: '16'
